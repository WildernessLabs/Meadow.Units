name: Develop Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    # need Foundation for MicroJson
    - name: Checkout Meadow.Foundation
      uses: actions/checkout@v4
      with:
        repository: WildernessLabs/Meadow.Foundation
        path: Meadow.Foundation
        ref: develop
        
    - name: Checkout Meadow.Units
      uses: actions/checkout@v4
      with:
        path: Meadow.Units

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: dotnet build -c Release Meadow.Units/Source/Meadow.Units/Meadow.Units.sln
